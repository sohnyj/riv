name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The MSVC STL in the xwin splat requires a clang newer than the runner default (STL1000).
      - name: Install the cross toolchain
        id: toolchain
        uses: ./.github/actions/cross-toolchain

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add x86_64-pc-windows-msvc

      # A branch that moved renames the library cache, so only main writes it back.
      - name: Build the codec libraries
        uses: ./.github/actions/codec-libraries
        with:
          llvm-version: ${{ steps.toolchain.outputs.llvm-version }}
          xwin-version: ${{ steps.toolchain.outputs.xwin-version }}
          save-caches: ${{ github.ref == 'refs/heads/main' }}

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test under wine
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: wine
          WINEDEBUG: "-all"
        run: cargo test
