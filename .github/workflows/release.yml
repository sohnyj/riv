name: Release

# Dispatch only: publishing the draft creates the tag, and a tag push must not run this again.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to GitHub release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the release notes list commits since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release names the package version and targets the dispatched commit; GitHub creates the
      # tag when the draft is published.
      - name: Resolve the release tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      # The MSVC STL in the xwin splat requires a clang newer than the runner default (STL1000).
      - name: Install the cross toolchain
        id: toolchain
        uses: ./.github/actions/cross-toolchain
        with:
          packages: p7zip-full

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc

      # Reads both codec caches and writes neither: a tag's scope is not one main can draw from.
      - name: Build the codec libraries
        uses: ./.github/actions/codec-libraries
        with:
          llvm-version: ${{ steps.toolchain.outputs.llvm-version }}
          xwin-version: ${{ steps.toolchain.outputs.xwin-version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test under wine
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: wine
          WINEDEBUG: "-all"
        run: cargo test

      - name: Package the release archive
        run: |
          cp target/x86_64-pc-windows-msvc/release/riv.exe .
          7z a -mx=9 "riv-${RELEASE_TAG}.7z" riv.exe LICENSE THIRD-PARTY-NOTICES.md

      # Every run keeps its archive, whether or not it goes to a GitHub release.
      - name: Upload the archive as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: riv-${{ env.RELEASE_TAG }}
          path: riv-${{ env.RELEASE_TAG }}.7z
          if-no-files-found: error

      # The commit list runs from the previous tag to the released commit, so it needs no tag of its own.
      - name: Compose the release notes
        if: inputs.upload
        run: |
          {
            echo "See the [README](https://github.com/sohnyj/riv#readme) for features and supported formats."
            echo
            awk '/^## Requirements$/{f=1} f && /^## / && !/^## Requirements$/{exit} f' README.md
            echo
            echo "## Changes"
            echo
            previous=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
            git log --format='- %s ([%h](https://github.com/sohnyj/riv/commit/%H))' "${previous:+$previous..}$GITHUB_SHA"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # A release for this version already existing (a tag on origin) is the error to see here.
      - name: Create the draft release
        if: inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "riv-${RELEASE_TAG}.7z"
