name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on the chosen branch (defaults to the package version)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the release notes list commits since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A dispatch without input releases the package version as-is.
      - name: Resolve the release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
            echo "RELEASE_TAG=${INPUT_TAG:-v$version}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      # The tag must name the package version, whichever path triggered the run.
      - name: Check the tag against the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Cargo.toml is at v$version but the release tag is $RELEASE_TAG" >&2
            exit 1
          fi

      # Tags pushed with GITHUB_TOKEN do not retrigger workflows; this run
      # carries the release through itself.
      - name: Create the release tag
        if: github.event_name == 'workflow_dispatch'
        run: git tag "$RELEASE_TAG"

      # The MSVC STL in the xwin splat requires a clang newer than the runner default (STL1000).
      - name: Install the cross toolchain
        id: toolchain
        uses: ./.github/actions/cross-toolchain
        with:
          packages: p7zip-full

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc

      # Reads both codec caches and writes neither: a tag's scope is not one main can draw from.
      - name: Build the codec libraries
        uses: ./.github/actions/codec-libraries
        with:
          llvm-version: ${{ steps.toolchain.outputs.llvm-version }}
          xwin-version: ${{ steps.toolchain.outputs.xwin-version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test under wine
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: wine
          WINEDEBUG: "-all"
        run: cargo test

      - name: Package the release archive
        run: |
          cp target/x86_64-pc-windows-msvc/release/riv.exe .
          7z a -mx=9 "riv-${RELEASE_TAG}.7z" riv.exe LICENSE THIRD-PARTY-NOTICES.md

      - name: Compose the release notes
        run: |
          {
            echo "See the [README](https://github.com/sohnyj/riv#readme) for features and supported formats."
            echo
            awk '/^## Requirements$/{f=1} f && /^## / && !/^## Requirements$/{exit} f' README.md
            echo
            echo "## Changes"
            echo
            previous=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
            git log --format='- %s ([%h](https://github.com/sohnyj/riv/commit/%H))' "${previous:+$previous..}$RELEASE_TAG"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Pushed only after the build and tests, so a failed run leaves no tag behind.
      - name: Push the release tag
        if: github.event_name == 'workflow_dispatch'
        run: git push origin "$RELEASE_TAG"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "riv-${RELEASE_TAG}.7z"
