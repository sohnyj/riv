[build]
target = "x86_64-pc-windows-msvc"

[target.x86_64-unknown-linux-gnu]
linker = "clang"

[target.x86_64-pc-windows-msvc]
linker = "lld-link"
rustflags = [
  "-C", "target-cpu=x86-64-v3",
  "-C", "target-feature=+crt-static",
  # xwin ships the MSVC static libraries without their PDBs.
  "-C", "link-arg=/ignore:4099",
]
