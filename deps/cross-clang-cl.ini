# clang-cl + xwin meson cross file; build_deps.sh resolves @XWIN_ROOT@, since meson reads no environment.

[binaries]
# The includes ride on the compiler entry; meson's ninja dep-prefix check compiles without c_args.
c = ['clang-cl', '--target=x86_64-pc-windows-msvc', '-imsvc', '@XWIN_ROOT@/crt/include', '-imsvc', '@XWIN_ROOT@/sdk/include/ucrt', '-imsvc', '@XWIN_ROOT@/sdk/include/um', '-imsvc', '@XWIN_ROOT@/sdk/include/shared']
ar = 'llvm-lib'
c_ld = 'lld-link'
nasm = 'nasm'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
c_args = ['/arch:AVX2', '/clang:-O3']
c_link_args = ['/libpath:@XWIN_ROOT@/crt/lib/x86_64', '/libpath:@XWIN_ROOT@/sdk/lib/um/x86_64', '/libpath:@XWIN_ROOT@/sdk/lib/ucrt/x86_64']
